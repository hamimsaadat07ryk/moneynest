:root {
  color-scheme: light;
  --bg: #f4f7fb; --bg-glow: rgba(18, 181, 160, .10);
  --card: #ffffff; --card-2: #f7f9fc; --ink: #0f172a; --muted: #64748b; --line: #e8edf3; --line-2: #f0f3f8;
  --input: #ffffff; --input-line: #dbe2ea; --hover: #f8fafc; --seg-bg: #edf1f6; --seg-on: #ffffff;
  --brand: #0f9d8a; --brand-2: #12b5a0; --brand-d: #0b7f70; --brand-soft: #e6f6f3; --brand-glow: rgba(15, 157, 138, .38);
  --pos: #16a34a; --neg: #e5484d; --save: #2f6fed; --warn: #f59e0b;
  --pos-soft: #e8f7ee; --neg-soft: #fdecee; --save-soft: #e9f0fe; --warn-soft: #fff3da;
  --pos-ink: #12803a; --neg-ink: #c92a31; --save-ink: #2358c9; --warn-ink: #9a5b00;
  --grid: #e8edf3; --zero: #cbd5e1; --hero-tint: rgba(18, 181, 160, .13);
  --glass: rgba(255, 255, 255, .86); --backdrop: rgba(15, 23, 42, .42);
  --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 22px rgba(15, 23, 42, .05);
  --radius: 18px;
  --font: "Inter", "Nirmala UI", "Noto Sans Bengali", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --font-display: "Poppins", "Inter", "Nirmala UI", "Noto Sans Bengali", "Segoe UI", system-ui, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #090f1d; --bg-glow: rgba(45, 212, 191, .10);
  --card: #111a2e; --card-2: #16213a; --ink: #e8eef9; --muted: #94a3bc; --line: #1f2d47; --line-2: #19243b;
  --input: #0d1526; --input-line: #2a3b5c; --hover: #17223a; --seg-bg: #0d1526; --seg-on: #1d2b48;
  --brand: #2dd4bf; --brand-2: #34e0c8; --brand-d: #5eead4; --brand-soft: rgba(45, 212, 191, .14); --brand-glow: rgba(45, 212, 191, .42);
  --pos: #34d399; --neg: #fb7185; --save: #6ea8fe; --warn: #fbbf24;
  --pos-soft: rgba(52, 211, 153, .14); --neg-soft: rgba(251, 113, 133, .14); --save-soft: rgba(110, 168, 254, .15); --warn-soft: rgba(251, 191, 36, .14);
  --pos-ink: #6ee7b7; --neg-ink: #fda4af; --save-ink: #9cc4ff; --warn-ink: #fcd34d;
  --grid: #22314f; --zero: #3b4d70; --hero-tint: rgba(45, 212, 191, .12);
  --glass: rgba(14, 22, 40, .84); --backdrop: rgba(2, 6, 15, .66);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .28);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body { background: radial-gradient(900px 420px at 85% -80px, var(--bg-glow), transparent 70%), var(--bg); background-attachment: fixed; min-height: 100vh; }
body.noscroll { overflow: hidden; }
html.theme-anim *, html.theme-anim *::before, html.theme-anim *::after { transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 8px; }
small { color: var(--muted); font-size: 12.5px; }
.ic { flex: none; vertical-align: middle; }
.muted { color: var(--muted); } .xs { font-size: 12.5px; } .center { text-align: center; } .pad { padding: 18px 0; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .save { color: var(--save); } .neu { color: var(--ink); }
:focus-visible { outline: 3px solid var(--brand-glow); outline-offset: 2px; border-radius: 10px; }
::selection { background: var(--brand-glow); }

/* ---------- layout ---------- */
.shell { min-height: 100vh; }
.side { display: none; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top-l { display: flex; align-items: center; gap: 10px; }
.top-r { display: flex; align-items: center; gap: 8px; }
.top-l img { width: 32px; height: 32px; border-radius: 9px; }
.top h1 { font-size: 19px; }
.main { padding-bottom: 118px; min-width: 0; }
#page { padding: 16px; max-width: 1080px; margin: 0 auto; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(6, 1fr); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
.navbtn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 6px 2px; font-size: 11px; color: var(--muted); border-radius: 12px; transition: color .2s, transform .2s; }
.navbtn:active { transform: scale(.94); }
.navbtn.on { color: var(--brand-d); font-weight: 600; }
.navbtn.on .ic { stroke-width: 2.2; filter: drop-shadow(0 0 6px var(--brand-glow)); }
.fab { position: fixed; right: 18px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 31; width: 56px; height: 56px; border-radius: 50%; border: 0; background: linear-gradient(135deg, var(--brand-2), #0b8f7c); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 24px var(--brand-glow); animation: glowpulse 3.2s ease-in-out infinite; transition: transform .2s; }
.fab:active { transform: scale(.94); }

@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 250px 1fr; }
  .side { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; padding: 22px 16px; background: var(--card); border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; padding: 0 6px 4px; font-family: var(--font-display); }
  .brand img { width: 38px; height: 38px; border-radius: 11px; box-shadow: 0 6px 16px -4px var(--brand-glow); }
  .sidenav { display: flex; flex-direction: column; gap: 4px; }
  .sidenav .navbtn { flex-direction: row; gap: 12px; font-size: 14.5px; padding: 11px 12px; text-align: left; }
  .sidenav .navbtn:hover { background: var(--hover); }
  .sidenav .navbtn.on { background: var(--brand-soft); box-shadow: inset 3px 0 0 var(--brand); }
  .side .sync-badge { margin-top: auto; }
  .tabs, .fab, .top-l img { display: none; }
  .main { padding-bottom: 40px; }
  .top { padding: 18px 28px; }
  #page { padding: 24px 28px; }
}

/* ---------- cards & basics ---------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px; transition: border-color .25s, box-shadow .25s, transform .25s; }
.card:hover { border-color: var(--brand-glow); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 900px) {
  .grid.home, .grid.settings, .grid.wishes { grid-template-columns: 1fr 1fr; grid-auto-flow: dense; }
  .grid.home > .full { grid-column: 1 / -1; }
}
.big { font-family: var(--font-display); font-size: 32px; font-weight: 700; letter-spacing: -.02em; }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; }
.kv > span:first-child { color: var(--muted); }
.link { background: none; border: 0; color: var(--brand-d); font-weight: 600; padding: 4px 2px; font-size: 14px; }
.link:hover { text-decoration: underline; }
.center-link { display: block; margin: 16px auto; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.ok { background: var(--pos); box-shadow: 0 0 8px var(--pos); } .dot.busy { background: var(--save); animation: pulse 1s infinite; } .dot.off { background: var(--warn); box-shadow: 0 0 8px var(--warn); } .dot.err { background: var(--neg); }
@keyframes pulse { 50% { opacity: .3; } }
.sync-badge { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); background: var(--seg-bg); border-radius: 999px; padding: 6px 11px; cursor: pointer; max-width: 56vw; }
.sync-badge span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.themebtn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; transition: transform .25s, box-shadow .25s, color .25s; }
.themebtn:hover { box-shadow: 0 0 16px var(--brand-glow); color: var(--brand-d); }
.themebtn:active { transform: rotate(25deg) scale(.92); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--card); border-radius: 13px; padding: 10px 16px; font-weight: 600; font-size: 14.5px; transition: transform .15s, box-shadow .25s, background-color .2s, border-color .2s; }
.btn:hover { background: var(--hover); border-color: var(--brand-glow); }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(135deg, var(--brand-2), #0b8f7c); border-color: transparent; color: #fff; box-shadow: 0 6px 18px -6px var(--brand-glow); }
.btn.primary:hover { box-shadow: 0 8px 26px -4px var(--brand-glow); filter: brightness(1.06); }
.btn.danger { color: var(--neg-ink); border-color: rgba(229, 72, 77, .35); background: var(--neg-soft); }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 11px; }
.btn.block { width: 100%; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.btns.end { justify-content: flex-end; margin-top: 16px; }
.iconbtn { background: none; border: 0; padding: 8px; border-radius: 10px; color: var(--muted); display: grid; place-items: center; }
.iconbtn:hover { background: var(--hover); color: var(--ink); }
.iconbtn.sm { padding: 4px; }

.ico { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-d); }
.ico.sm { width: 32px; height: 32px; border-radius: 10px; }
.ico.xs { width: 22px; height: 22px; border-radius: 7px; }
.emo { font-size: 21px; line-height: 1; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", var(--font); }
.ico.sm .emo { font-size: 17px; } .ico.xs .emo { font-size: 13px; }
.pos-bg { background: var(--pos-soft); color: var(--pos); } .neg-bg { background: var(--neg-soft); color: var(--neg); } .save-bg { background: var(--save-soft); color: var(--save); }

/* hero */
.hero { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; background: radial-gradient(520px 220px at 0% 0%, var(--hero-tint), transparent 70%), var(--card); }
.hero .big { text-shadow: 0 0 28px var(--brand-glow); }
.accs { display: flex; flex-wrap: wrap; gap: 10px; }
.acc { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px 8px 10px; transition: transform .2s, box-shadow .2s; }
.acc:hover { transform: translateY(-2px); box-shadow: 0 8px 20px -10px var(--brand-glow); }
.acc span:last-child { display: flex; flex-direction: column; line-height: 1.25; }
.acc b { font-size: 15px; }
.wish-hero { flex-wrap: nowrap; margin-bottom: 14px; }

/* greeting + streak */
.greet { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 2px 2px 4px; }
.greet small { display: block; font-size: 13px; letter-spacing: .02em; }
.greet h2 { font-size: 26px; margin-top: 2px; }
.greet h2 .wave { display: inline-block; transform-origin: 70% 70%; animation: wave 2.4s ease-in-out 1; }
.greet .gname { background: linear-gradient(90deg, var(--brand), var(--save)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.streak { display: inline-flex; align-items: center; gap: 9px; border: 0; border-radius: 999px; padding: 9px 16px 9px 12px; font-weight: 700; font-size: 14px; color: var(--warn-ink); background: linear-gradient(135deg, var(--warn-soft), var(--neg-soft)); box-shadow: 0 0 0 1px rgba(245, 158, 11, .28), 0 8px 22px -8px rgba(245, 158, 11, .6); animation: streakglow 3s ease-in-out infinite; transition: transform .2s; }
.streak:hover { transform: translateY(-2px); }
.streak .fl { font-size: 20px; display: inline-block; animation: flicker 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
.streak small { color: inherit; opacity: .75; font-weight: 600; font-size: 12px; }
.streak.t0 { color: var(--muted); background: var(--seg-bg); box-shadow: none; animation: none; }
.streak.t0 .fl { animation: none; filter: grayscale(1); opacity: .6; }
.streak.t3 { color: #fff; background: linear-gradient(135deg, #f97316, #e5484d); box-shadow: 0 0 0 1px rgba(249, 115, 22, .5), 0 10px 28px -6px rgba(249, 115, 22, .75); }
.streak.t4 { color: #fff; background: linear-gradient(135deg, #8b5cf6, #ec4899); box-shadow: 0 0 0 1px rgba(139, 92, 246, .5), 0 10px 30px -6px rgba(168, 85, 247, .8); }
.streak.t3 small, .streak.t4 small { opacity: .9; }
.sbig { text-align: center; padding: 6px 0 10px; }
.sbig .fl { font-size: 54px; display: inline-block; animation: flicker 1.6s ease-in-out infinite; }
.sbig .num { font-family: var(--font-display); font-size: 44px; font-weight: 700; line-height: 1; text-shadow: 0 0 26px rgba(249, 115, 22, .45); }
.sdots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin: 12px 0; }
.sdot { text-align: center; font-size: 11px; color: var(--muted); }
.sdot i { display: grid; place-items: center; width: 100%; aspect-ratio: 1; max-width: 38px; margin: 0 auto 3px; border-radius: 50%; font-style: normal; font-weight: 700; font-size: 14px; background: var(--seg-bg); color: var(--muted); }
.sdot.ok i { background: var(--pos-soft); color: var(--pos); box-shadow: 0 0 12px -2px var(--pos); }
.sdot.bad i { background: var(--neg-soft); color: var(--neg); }
.sdot.today i { outline: 2px solid var(--brand); outline-offset: 2px; }

/* alert banner */
.alert { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; border: 1px solid rgba(229, 72, 77, .35); background: var(--neg-soft); color: var(--neg-ink); font-weight: 600; text-align: left; width: 100%; }
.alert.soon { border-color: rgba(245, 158, 11, .4); background: var(--warn-soft); color: var(--warn-ink); }
.alert .emo { font-size: 22px; }
.alert small { color: inherit; opacity: .8; display: block; font-weight: 500; }

/* today */
.today { display: flex; gap: 14px; align-items: center; }
.today.empty { justify-content: flex-start; }
.today-r { flex: 1; min-width: 0; }
.today-r h3 { margin-bottom: 8px; }
.pill { display: inline-block; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 5px 11px; margin: 6px 6px 0 0; }
.pill.ok { background: var(--pos-soft); color: var(--pos-ink); } .pill.bad { background: var(--neg-soft); color: var(--neg-ink); } .pill.save { background: var(--save-soft); color: var(--save-ink); }
.bar { height: 10px; background: var(--seg-bg); border-radius: 999px; overflow: hidden; margin: 6px 0 10px; }
.bar i { display: block; height: 100%; border-radius: 999px; box-shadow: 0 0 12px -1px currentColor; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { padding: 13px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.stat b { font-size: 17px; overflow-wrap: anywhere; font-family: var(--font-display); }
.stat .ico { margin-bottom: 4px; }
@media (max-width: 420px) { .stat { padding: 11px 9px; } .stat b { font-size: 14.5px; } .today { flex-direction: column; align-items: stretch; text-align: left; } .today .ring { align-self: center; } .greet h2 { font-size: 22px; } }

/* quick add */
.qa-list { display: flex; flex-wrap: wrap; gap: 10px; }
.qa-item { flex: 1 1 190px; display: flex; flex-direction: column; gap: 9px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--card-2); transition: border-color .25s, box-shadow .25s; }
.qa-item:hover { border-color: var(--brand-glow); box-shadow: 0 8px 22px -12px var(--brand-glow); }
.qa-top { display: flex; align-items: center; gap: 9px; font-weight: 600; }
.qa-top .badge { margin-left: auto; font-size: 11.5px; font-weight: 700; color: var(--brand-d); background: var(--brand-soft); border-radius: 999px; padding: 2px 8px; }
.qa-amts { display: flex; flex-wrap: wrap; gap: 8px; }
.qa-amt { border: 1px solid var(--brand-glow); background: var(--card); color: var(--brand-d); font-weight: 700; border-radius: 12px; padding: 7px 14px; font-size: 14.5px; transition: transform .12s, box-shadow .2s, background-color .2s; }
.qa-amt:hover { background: var(--brand-soft); box-shadow: 0 0 16px -2px var(--brand-glow); }
.qa-amt:active { transform: scale(.92); }
.qa-amt.other { color: var(--muted); border-color: var(--line); font-weight: 600; }
.qa-empty { text-align: center; color: var(--muted); padding: 8px 0; }

/* rows */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line-2); padding: 11px 6px; border-radius: 10px; transition: background-color .15s; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--hover); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-main b { font-weight: 600; overflow-wrap: anywhere; }
.row-main small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.amt { font-weight: 700; white-space: nowrap; font-family: var(--font-display); }
.day { padding: 12px 14px 4px; margin-bottom: 12px; }
.day-h { display: flex; justify-content: space-between; padding: 0 2px 6px; font-size: 13.5px; border-bottom: 1px solid var(--line); }
.empty-state { text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 34px 16px; }
.empty-state .big-emo { font-size: 44px; line-height: 1; animation: floaty 3.4s ease-in-out infinite; }

/* tx page */
.monthnav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 14px; }
.monthnav span { min-width: 150px; text-align: center; font-weight: 700; font-size: 16px; font-family: var(--font-display); }
.monthnav button { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; transition: box-shadow .2s; }
.monthnav button:hover:not(:disabled) { box-shadow: 0 0 14px -2px var(--brand-glow); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.search { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px; background: var(--input); border: 1px solid var(--input-line); border-radius: 13px; padding: 0 12px; color: var(--muted); }
.search input { border: 0; background: none; padding: 10px 0; width: 100%; outline: none; color: var(--ink); }
.summary { display: flex; flex-wrap: wrap; gap: 6px 18px; font-weight: 600; margin: 4px 2px 14px; font-size: 14px; }
.seg { display: inline-flex; background: var(--seg-bg); border-radius: 13px; padding: 4px; gap: 2px; max-width: 100%; overflow-x: auto; }
.seg button, .seg label { border: 0; background: none; padding: 8px 13px; border-radius: 10px; font-weight: 600; font-size: 13.5px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; transition: background-color .2s, color .2s, box-shadow .2s; }
.seg label input { display: none; }
.seg .on { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 3px rgba(15, 23, 42, .12), 0 0 14px -4px var(--brand-glow); }
.seg.big { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; }
.seg.big button { justify-content: center; padding: 10px 6px; }
.seg.big .on.expense { color: var(--neg); } .seg.big .on.income { color: var(--pos); } .seg.big .on.transfer { color: var(--save); }

/* charts */
svg { display: block; max-width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.legend span, .cat-list li { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 11px; height: 11px; border-radius: 4px; display: inline-block; flex: none; }
.sw.dash { background: none; border-top: 2px dashed var(--warn); height: 0; width: 16px; border-radius: 0; }
.mini-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
.mini-stats > div { background: var(--card-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; }
.chart-empty { text-align: center; color: var(--muted); padding: 30px 0; }
.donut-wrap { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: center; }
.cat-list { list-style: none; padding: 0; margin: 0; flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 9px; }
.cat-list li { display: grid; grid-template-columns: 14px 1fr auto 42px; gap: 8px; align-items: center; }
.cat-list small { text-align: right; }
.bar-glow { filter: drop-shadow(0 0 5px var(--brand-glow)); }
.ring-arc { filter: drop-shadow(0 0 6px currentColor); }
.reportbar { display: flex; justify-content: center; margin: -4px 0 14px; }

/* wishlist */
.wish-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.wish-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.wish-nums div { display: flex; flex-direction: column; min-width: 0; }
.wish-nums b { overflow-wrap: anywhere; font-family: var(--font-display); }
.wish.done { opacity: .82; }
.wish.complete { border-color: var(--pos); box-shadow: 0 0 0 1px var(--pos), 0 10px 30px -12px var(--pos); }
.log { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
.log-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; padding: 5px 0; font-size: 13.5px; }

/* loans (lend / borrow) */
.split2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mid { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.stats.two { grid-template-columns: 1fr 1fr; }
.pbar { margin: 12px 0; }
.avatar { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 17px; font-family: var(--font-display); }
.avatar.lg { width: 54px; height: 54px; font-size: 22px; }
.bs { display: block; text-align: right; font-weight: 500; font-size: 11.5px; color: var(--muted); white-space: normal; max-width: 150px; margin-left: auto; font-family: var(--font); }
.backlink { display: inline-flex; align-items: center; gap: 4px; margin-bottom: 8px; }
.person-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.person-head .row-main small { white-space: normal; }
.pname { font-size: 20px; font-family: var(--font-display); }
.status { margin-bottom: 12px; text-align: center; }
.status .big { margin: 2px 0; }
.pos-card { background: radial-gradient(400px 160px at 50% 0%, var(--pos-soft), transparent 75%), var(--card); }
.neg-card { background: radial-gradient(400px 160px at 50% 0%, var(--neg-soft), transparent 75%), var(--card); }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
.grid4 .stat b { font-size: 15px; }
@media (max-width: 700px) { .grid4 { grid-template-columns: 1fr 1fr; } }
.btns.four { margin: 0 0 14px; }
.btns.four .btn { flex: 1 1 calc(50% - 8px); }
@media (min-width: 900px) { .btns.four .btn { flex: 1 1 0; } }
.due { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; font-family: var(--font); }
.due.over { background: var(--neg-soft); color: var(--neg-ink); box-shadow: 0 0 12px -3px var(--neg); }
.due.soon { background: var(--warn-soft); color: var(--warn-ink); }
.due.later { background: var(--brand-soft); color: var(--brand-d); }
.due.paid { background: var(--pos-soft); color: var(--pos-ink); }
.duechips { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

/* emoji picker */
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 6px; max-height: 148px; overflow-y: auto; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: var(--card-2); }
.emoji-btn { font-size: 22px; line-height: 1; border: 1px solid transparent; border-radius: 10px; padding: 6px 0; background: none; transition: transform .12s, background-color .15s; font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", var(--font); }
.emoji-btn:hover { background: var(--hover); transform: scale(1.12); }
.emoji-btn.on { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 0 14px -2px var(--brand-glow); }
.emoji-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.emoji-row input { width: 64px !important; text-align: center; font-size: 22px; padding: 6px !important; }

/* settings / forms */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field input, .field select, .pin { border: 1px solid var(--input-line); background: var(--input); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0; transition: border-color .2s, box-shadow .2s; }
.field input:focus, .field select:focus, .pin:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft), 0 0 18px -4px var(--brand-glow); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } }
.check { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; font-weight: 600; }
.check input { width: 18px; height: 18px; accent-color: var(--brand); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

<script>window.MN_CONFIG = Object.assign({ googleClientId: '' }, window.MN_CONFIG || {});</script>
<script>'use strict';
/* =====================================================================
   MoneyNest core: storage on device, sync with the PC, helpers
   ===================================================================== */
const APP_KEY = 'mn_v1';
/* true when the app runs from the web (phone) instead of from the server on your PC */
const STANDALONE = (window.MN_CONFIG && typeof MN_CONFIG.standalone === 'boolean') ? MN_CONFIG.standalone : !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- small pure-JS SHA-256 (used only for the on-device PIN lock) ---------- */
const sha256 = (() => {
  const K = [], H0 = [];
  let p = 2, n = 0;
  while (n < 64) {
    let prime = true;
    for (let d = 2; d * d <= p; d++) if (p % d === 0) { prime = false; break; }
    if (prime) {
      if (n < 8) H0[n] = (Math.pow(p, 1 / 2) % 1 * 4294967296) | 0;
      K[n] = (Math.pow(p, 1 / 3) % 1 * 4294967296) | 0;
      n++;
    }
    p++;
  }
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  return function (str) {
    const bytes = new TextEncoder().encode(str);
    const l = bytes.length;
    const total = (((l + 8) >> 6) + 1) * 16;
    const words = new Int32Array(total);
    for (let i = 0; i < l; i++) words[i >> 2] |= bytes[i] << (24 - (i % 4) * 8);
    words[l >> 2] |= 0x80 << (24 - (l % 4) * 8);
    words[total - 1] = l * 8;
    let H = H0.slice();
    for (let j = 0; j < total; j += 16) {
      const w = Array.from(words.subarray(j, j + 16));
      const old = H.slice(0, 8);
      for (let i = 0; i < 64; i++) {
        const w15 = w[i - 15], w2 = w[i - 2];
        const a = H[0], e = H[4];
        const wi = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0;
        w[i] = wi;
        const t1 = H[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & H[5]) ^ (~e & H[6])) + K[i] + wi;
        const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & H[1]) ^ (a & H[2]) ^ (H[1] & H[2]));
        H = [(t1 + t2) | 0].concat(H.slice(0, 7));
        H[4] = (H[4] + t1) | 0;
      }
      for (let i = 0; i < 8; i++) H[i] = (H[i] + old[i]) | 0;
    }
    return H.map(x => ('00000000' + (x >>> 0).toString(16)).slice(-8)).join('');
  };
})();

/* ---------- Store: everything lives in this device's browser storage and
   is merged with the PC database by Sync (last write wins per record) ---------- */
const Store = {
  d: null,
  load() {
    try { this.d = JSON.parse(localStorage.getItem(APP_KEY)); } catch (e) { this.d = null; }
    if (!this.d || !this.d.records) {
      this.d = { records: {}, seq: 0, dirty: {}, token: '', salt: '', pinHash: '', lastSync: 0, lang: 'en', seeded: 0, seeded2: 0 };
    }
  },
  save() {
    try { localStorage.setItem(APP_KEY, JSON.stringify(this.d)); }
    catch (e) { if ((typeof UI !== "undefined" && UI)) UI.toast('Storage is full on this device'); }
  },
  list(kind) {
    const out = [];
    for (const key in this.d.records) {
      const r = this.d.records[key];
      if (r.kind === kind && !r.deleted) out.push(Object.assign({}, r.data, { id: r.id }));
    }
    return out;
  },
  get(kind, id) {
    const r = this.d.records[kind + ':' + id];
    return r && !r.deleted ? Object.assign({}, r.data, { id: r.id }) : null;
  },
  put(kind, id, data) {
    const key = kind + ':' + id;
    const old = this.d.records[key];
    const ts = Math.max(Date.now(), (old ? old.updated_at : 0) + 1);
    const clean = Object.assign({}, data); delete clean.id;
    this.d.records[key] = { kind, id, data: clean, updated_at: ts, deleted: 0 };
    this.d.dirty[key] = ts;
    this.save();
    Sync.soon();
  },
  remove(kind, id) {
    const key = kind + ':' + id;
    const old = this.d.records[key];
    if (!old) return;
    const ts = Math.max(Date.now(), old.updated_at + 1);
    this.d.records[key] = { kind, id, data: old.data, updated_at: ts, deleted: 1 };
    this.d.dirty[key] = ts;
    this.save();
    Sync.soon();
  },
  /* default accounts/categories use fixed ids so every device agrees */
  seed() {
    if (this.d.seeded) return;
    const put = (kind, id, data) => { this.d.records[kind + ':' + id] = { kind, id, data, updated_at: 1, deleted: 0 }; };
    [['acc_cash', 'Cash', 'নগদ টাকা', 'cash'], ['acc_bkash', 'bKash', 'বিকাশ', 'phone'], ['acc_bank', 'Bank', 'ব্যাংক', 'bank']]
      .forEach(([id, name, nameBn, icon], i) => put('account', id, { name, nameBn, icon, opening: 0, order: i }));
    const ex = [
      ['cat_food', 'Food', 'খাবার', 'food', '#f97316'], ['cat_transport', 'Transport', 'যাতায়াত', 'bus', '#3b82f6'],
      ['cat_study', 'Study', 'পড়াশোনা', 'book', '#8b5cf6'], ['cat_shopping', 'Shopping', 'কেনাকাটা', 'bag', '#ec4899'],
      ['cat_bills', 'Bills', 'বিল', 'bolt', '#eab308'], ['cat_health', 'Health', 'স্বাস্থ্য', 'pulse', '#ef4444'],
      ['cat_fun', 'Entertainment', 'বিনোদন', 'fun', '#14b8a6'], ['cat_wish', 'Wishlist', 'উইশলিস্ট', 'heart', '#d946ef'],
      ['cat_other', 'Other', 'অন্যান্য', 'dots', '#64748b']];
    ex.forEach(([id, name, nameBn, icon, color], i) => put('category', id, { name, nameBn, icon, color, type: 'expense', order: i }));
    const inc = [
      ['cat_parents', 'Parents', 'বাবা-মা', 'users', '#16a34a'], ['cat_salary', 'Salary / Job', 'বেতন / চাকরি', 'briefcase', '#0ea5e9'],
      ['cat_gift', 'Gift', 'উপহার', 'gift', '#f43f5e'], ['cat_other_in', 'Other', 'অন্যান্য', 'dots', '#64748b']];
    inc.forEach(([id, name, nameBn, icon, color], i) => put('category', id, { name, nameBn, icon, color, type: 'income', order: i }));
    this.d.seeded = 1;
    this.save();
  },
  /* one-tap shortcuts (Bus 10/15, Cigarette 10/23) are added once, for old and new users */
  seed2() {
    if (this.d.seeded2) return;
    const put = (id, data) => { this.d.records['quick:' + id] = { kind: 'quick', id, data, updated_at: 1, deleted: 0 }; };
    put('q_bus', { name: 'Bus', nameBn: 'বাস', emoji: '🚌', cat: 'cat_transport', amounts: [10, 15], order: 0 });
    put('q_cig', { name: 'Cigarette', nameBn: 'সিগারেট', emoji: '🚬', cat: 'cat_fun', amounts: [10, 23], order: 1 });
    this.d.seeded2 = 1;
    this.save();
  }
};

/* ---------- emoji defaults (used when the user has not picked one) ---------- */
const DEFAULT_EMOJI = {
  cat_food: '🍔', cat_transport: '🚌', cat_study: '📚', cat_shopping: '🛍️', cat_bills: '💡', cat_health: '💊', cat_fun: '🎬', cat_wish: '🎁', cat_other: '✨',
  cat_parents: '👨‍👩‍👧', cat_salary: '💼', cat_gift: '🎁', cat_other_in: '✨', acc_cash: '💵', acc_bkash: '📱', acc_bank: '🏦'
};
const EMOJI_SET = ['🍔', '🍕', '🍜', '☕', '🥤', '🍎', '🛒', '🚌', '🚕', '🚆', '⛽', '🏍️', '📚', '✏️', '🎓', '🛍️', '👕', '👟', '💡', '📱', '💻', '🎧', '🎬', '🎮', '🎵', '🚬', '🍿', '⚽', '💊', '🏥', '🎁', '🎂', '🏠', '💼', '💰', '💵', '🏦', '👨‍👩‍👧', '❤️', '✈️', '🐶', '🌟', '✨', '🔧', '💈', '🧾', '🙏', '🎯'];
/* once a record has an emoji field (even empty) the user's choice wins; otherwise use the default */
const emojiOf = o => (o ? (typeof o.emoji === 'string' ? o.emoji : (DEFAULT_EMOJI[o.id] || '')) : '');

/* ---------- theme: light / dark / auto (stored in this browser) ---------- */
const Theme = {
  key: 'mn_theme',
  get() { try { return localStorage.getItem(this.key) || 'light'; } catch (e) { return 'light'; } },
  resolved(mode) { mode = mode || this.get(); return mode === 'auto' ? (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode; },
  apply(mode, animate) {
    const r = this.resolved(mode), el = document.documentElement;
    if (animate) { el.classList.add('theme-anim'); setTimeout(() => el.classList.remove('theme-anim'), 500); }
    el.setAttribute('data-theme', r);
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', r === 'dark' ? '#090f1d' : '#ffffff');
  },
  set(mode) { try { localStorage.setItem(this.key, mode); } catch (e) { /* ignore */ } this.apply(mode, true); },
  toggle() { this.set(this.resolved() === 'dark' ? 'light' : 'dark'); }
};
if (window.matchMedia) {
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (Theme.get() === 'auto') Theme.apply('auto', true); }); } catch (e) { /* old browser */ }
}

/* ---------- Sync with the PC ---------- */
const Sync = {
  busy: false,
  timer: null,
  status: 'offline', // ok | syncing | offline | auth
  async api(path, body) {
    const headers = { 'Content-Type': 'application/json' };
    if (Store.d.token) headers.Authorization = 'Bearer ' + Store.d.token;
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 12000);
    try {
      const r = await fetch(path, { method: body ? 'POST' : 'GET', headers, body: body ? JSON.stringify(body) : undefined, signal: ctl.signal, cache: 'no-store' });
      let j = {};
      try { j = await r.json(); } catch (e) { /* not json */ }
      if (!r.ok) { const err = new Error(j.error || ('HTTP ' + r.status)); err.status = r.status; err.data = j; throw err; }
      return j;
    } finally { clearTimeout(to); }
  },
  setStatus(s) { this.status = s; if ((typeof UI !== "undefined" && UI)) UI.syncBadge(); },
  soon() { if ((typeof UI !== "undefined" && UI)) UI.syncBadge(); if ((typeof Drive !== "undefined" && Drive)) Drive.soon(); clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 700); },
  async run(retry) {
    if (this.busy || !Store.d.token) return;
    this.busy = true;
    this.setStatus('syncing');
    try {
      const keys = Object.keys(Store.d.dirty);
      const sentAt = {};
      const changes = keys.map(k => {
        const r = Store.d.records[k];
        sentAt[k] = r.updated_at;
        return { kind: r.kind, id: r.id, data: r.data, updated_at: r.updated_at, deleted: r.deleted };
      });
      const res = await this.api('/api/sync', { since: Store.d.seq, changes });
      for (const k of keys) if (Store.d.dirty[k] === sentAt[k]) delete Store.d.dirty[k];
      let touched = false;
      for (const ch of res.changes) {
        const key = ch.kind + ':' + ch.id;
        if (Store.d.dirty[key]) continue; // a newer local edit is still waiting to be sent
        const loc = Store.d.records[key];
        if (!loc || ch.updated_at > loc.updated_at) {
          Store.d.records[key] = { kind: ch.kind, id: ch.id, data: ch.data, updated_at: ch.updated_at, deleted: ch.deleted ? 1 : 0 };
          touched = true;
        }
      }
      if (res.seq < Store.d.seq && !retry) { // PC database was restored/replaced: start over
        Store.d.seq = 0;
        for (const k in Store.d.records) Store.d.dirty[k] = Store.d.records[k].updated_at;
        Store.save(); this.busy = false;
        return this.run(true);
      }
      Store.d.seq = res.seq;
      Store.d.lastSync = Date.now();
      Store.save();
      this.setStatus('ok');
      if (touched && (typeof UI !== "undefined" && UI)) { UI.refresh(); if ((typeof Drive !== "undefined" && Drive)) Drive.soon(); }
    } catch (e) {
      if (e.status === 401) { this.setStatus('auth'); if ((typeof UI !== "undefined" && UI)) UI.needLogin(); }
      else this.setStatus('offline');
    } finally { this.busy = false; }
  },
  pending() { return Object.keys(Store.d.dirty).length; }
};

/* ---------- date + money helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => isoDate(new Date());
const monthOf = iso => iso.slice(0, 7);
const curMonth = () => monthOf(todayISO());
const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const shiftMonth = (ym, delta) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + delta, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const locale = () => (Store.d.lang === 'bn' ? 'bn-BD' : 'en-IN');
const BN_DIGITS = '০১২৩৪৫৬৭৮৯';
const localDigits = s => (Store.d.lang === 'bn' ? String(s).replace(/[0-9]/g, d => BN_DIGITS[d]) : String(s));
const num = n => { const v = Math.round((+n || 0) * 100) / 100; return Math.abs(v).toLocaleString(locale(), { maximumFractionDigits: 2 }); };
const money = n => { const v = Math.round((+n || 0) * 100) / 100; return (v < 0 ? '−' : '') + '৳' + num(v); };
const shortNum = n => {
  const a = Math.abs(n);
  let s;
  if (a >= 100000) s = (n / 100000).toFixed(a % 100000 ? 1 : 0).replace(/\.0$/, '') + (Store.d.lang === 'bn' ? ' লা' : 'L');
  else if (a >= 1000) s = (n / 1000).toFixed(a % 1000 ? 1 : 0).replace(/\.0$/, '') + 'k';
  else s = String(Math.round(n));
  return localDigits(s);
};
const fmtDate = (iso, opts) => new Date(iso + 'T00:00:00').toLocaleDateString(locale(), opts || { day: 'numeric', month: 'short' });
const fmtMonth = ym => new Date(ym + '-01T00:00:00').toLocaleDateString(locale(), { month: 'long', year: 'numeric' });
const daysUntil = iso => Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 86400000);
const fmtMonthShort = ym => new Date(ym + '-01T00:00:00').toLocaleDateString(locale(), { month: 'short' });

/* ---------- derived numbers ---------- */
const Calc = {
  settings() { return Object.assign({ monthlyBudget: 0, dailyLimit: 0, name: '' }, Store.get('settings', 'main') || {}); },
  txs() { return Store.list('tx').filter(t => typeof t.date === 'string' && t.date.length === 10 && isFinite(+t.amount)); },
  accounts() { return Store.list('account').sort((a, b) => (a.order || 0) - (b.order || 0)); },
  categories(type) { return Store.list('category').filter(c => !type || c.type === type).sort((a, b) => (a.order || 0) - (b.order || 0)); },
  balances(txs) {
    const accs = this.accounts();
    const bal = {};
    accs.forEach(a => { bal[a.id] = +a.opening || 0; });
    (txs || this.txs()).forEach(t => {
      if (!(t.account in bal)) return;
      if (t.type === 'income') bal[t.account] += +t.amount;
      else if (t.type === 'expense') bal[t.account] -= +t.amount;
      else if (t.type === 'transfer') { bal[t.account] -= +t.amount; if (t.to in bal) bal[t.to] += +t.amount; }
    });
    // lend/borrow entries move real money in and out of accounts (but are not income/expense)
    this.loans().forEach(l => {
      if (!(l.account in bal)) return;
      bal[l.account] += (l.kind === 'borrow' || l.kind === 'back') ? +l.amount : -l.amount;
    });
    return bal;
  },
  /* ---- lend / borrow ----
     kinds: lend = I gave money, back = they paid me back, borrow = I took money, pay = I paid back
     net > 0  -> they owe me     net < 0  -> I owe them */
  people() { return Store.list('person').sort((a, b) => (a.code || '').localeCompare(b.code || '')); },
  loans(personId) {
    const ids = new Set(Store.list('person').map(p => p.id));
    return Store.list('loan').filter(l => ids.has(l.personId) && isFinite(+l.amount) && (!personId || l.personId === personId));
  },
  loanDelta(l) { const a = +l.amount; return (l.kind === 'lend' || l.kind === 'pay') ? a : -a; },
  personStats(personId, all) {
    const st = { lent: 0, back: 0, borrowed: 0, paid: 0, net: 0, count: 0 };
    (all || this.loans(personId)).forEach(l => {
      if (l.personId !== personId) return;
      st.count++;
      if (l.kind === 'lend') st.lent += +l.amount; else if (l.kind === 'back') st.back += +l.amount;
      else if (l.kind === 'borrow') st.borrowed += +l.amount; else if (l.kind === 'pay') st.paid += +l.amount;
    });
    st.net = (st.lent - st.back) - (st.borrowed - st.paid);
    return st;
  },
  loanTotals() {
    const all = this.loans(), out = { toGet: 0, toPay: 0 };
    this.people().forEach(p => { const n = this.personStats(p.id, all).net; if (n > 0.004) out.toGet += n; else if (n < -0.004) out.toPay += -n; });
    return out;
  },
  nextPersonCode() {
    let max = 0;
    Store.list('person').forEach(p => { const m = /^P-(\d+)$/.exec(p.code || ''); if (m) max = Math.max(max, +m[1]); });
    return 'P-' + String(max + 1).padStart(3, '0');
  },
  /* ---- quick-add shortcuts ---- */
  quicks() { return Store.list('quick').filter(q => Array.isArray(q.amounts)).sort((a, b) => (a.order || 0) - (b.order || 0)); },

  /* ---- loan due dates ----
     Repayments are matched to the oldest loan first (FIFO), separately for "I lent" and "I borrowed".
     Returns { entryId: {remaining, repaid} } for lend / borrow entries. */
  loanOpen(personId, all) {
    const list = (all || this.loans(personId)).filter(l => l.personId === personId);
    const out = {};
    [['lend', 'back'], ['borrow', 'pay']].forEach(([give, ret]) => {
      let pool = list.filter(l => l.kind === ret).reduce((s, l) => s + +l.amount, 0);
      list.filter(l => l.kind === give).sort((a, b) => a.date.localeCompare(b.date) || (a.ts || 0) - (b.ts || 0) || a.id.localeCompare(b.id)).forEach(l => {
        const used = Math.min(pool, +l.amount);
        pool -= used;
        out[l.id] = { remaining: +l.amount - used, repaid: used };
      });
    });
    return out;
  },
  /* open loans that have a due date, soonest first */
  dueList() {
    const all = this.loans(), res = [];
    this.people().forEach(p => {
      const open = this.loanOpen(p.id, all);
      all.forEach(l => {
        if (l.personId !== p.id || !l.due || !open[l.id] || open[l.id].remaining <= 0.004) return;
        res.push({ loan: l, person: p, remaining: open[l.id].remaining, dir: l.kind === 'lend' ? 'get' : 'owe', due: l.due, days: daysUntil(l.due) });
      });
    });
    return res.sort((a, b) => a.due.localeCompare(b.due));
  },

  /* ---- streak: days in a row you stayed within your daily limit ----
     A day counts when spent <= limit. Counting starts on your first entry; today counts while you are still under. */
  streak(txs, limit) {
    const res = { cur: 0, best: 0, last7: [], hasLimit: limit > 0, started: false };
    const dates = txs.map(t => t.date).sort();
    const first = dates[0];
    const today = todayISO();
    const spent = {};
    txs.forEach(t => { if (t.type === 'expense' && !t.wishId) spent[t.date] = (spent[t.date] || 0) + +t.amount; });
    const ok = d => limit > 0 && (spent[d] || 0) <= limit;
    if (first) res.started = true;
    for (let i = 6; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i); const date = isoDate(d);
      res.last7.push({ date, ok: !!first && date >= first && ok(date), skip: !first || date < first || !(limit > 0), today: date === today, label: d.getDay() });
    }
    if (!first || !(limit > 0)) return res;
    let run = 0, d = new Date(first + 'T00:00:00'), end = new Date(today + 'T00:00:00');
    for (; d <= end; d.setDate(d.getDate() + 1)) {
      if (ok(isoDate(d))) { run++; res.best = Math.max(res.best, run); } else run = 0;
    }
    res.cur = run; // the walk ends today, so run is the live streak
    return res;
  },
  wishSavedMap() {
    const m = {};
    Store.list('wishsave').forEach(e => { m[e.wishId] = (m[e.wishId] || 0) + (e.type === 'add' ? +e.amount : -e.amount); });
    return m;
  },
  reserved() {
    const m = this.wishSavedMap();
    return Store.list('wish').filter(w => w.status !== 'bought').reduce((s, w) => s + Math.max(0, m[w.id] || 0), 0);
  },
  /* money you actually "spend" for limits: expenses except wishlist purchases */
  spentOn(txs, date) { return txs.filter(t => t.type === 'expense' && !t.wishId && t.date === date).reduce((s, t) => s + +t.amount, 0); },
  monthStats(txs, ym) {
    const m = txs.filter(t => monthOf(t.date) === ym);
    const income = m.filter(t => t.type === 'income').reduce((s, t) => s + +t.amount, 0);
    const expenseAll = m.filter(t => t.type === 'expense').reduce((s, t) => s + +t.amount, 0);
    const expense = m.filter(t => t.type === 'expense' && !t.wishId).reduce((s, t) => s + +t.amount, 0);
    return { income, expenseAll, expense, saved: income - expenseAll };
  },
  /* money saved by staying under the daily limit, cumulative up to `upTo` */
  limitSavings(txs, ym, limit, upTo) {
    const n = daysInMonth(ym);
    const last = upTo ? Math.min(n, +upTo.slice(8)) : n;
    const pts = [];
    let cum = 0;
    for (let d = 1; d <= last; d++) {
      const date = ym + '-' + pad(d);
      const spent = this.spentOn(txs, date);
      const diff = limit > 0 ? limit - spent : 0;
      cum += diff;
      pts.push({ date, day: d, spent, diff, cum });
    }
    return pts;
  }
};

/* ---------- CSV / JSON export ---------- */
function download(name, text, type) {
  const blob = new Blob([text], { type: type || 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportLoansCSV() {
  const accs = Object.fromEntries(Calc.accounts().map(a => [a.id, a.name]));
  const people = Object.fromEntries(Calc.people().map(p => [p.id, p]));
  const label = { lend: 'I lent', back: 'They paid me back', borrow: 'I borrowed', pay: 'I paid back' };
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['Person ID', 'Person', 'Date', 'Type', 'Amount', 'Account', 'Note']];
  Calc.loans().sort((a, b) => a.date.localeCompare(b.date)).forEach(l =>
    rows.push([people[l.personId].code, people[l.personId].name, l.date, label[l.kind] || l.kind, l.amount, accs[l.account] || '', l.note || '']));
  download('moneynest-loans.csv', '\ufeff' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
}
function exportCSV() {
  const accs = Object.fromEntries(Calc.accounts().map(a => [a.id, a.name]));
  const cats = Object.fromEntries(Store.list('category').map(c => [c.id, c.name]));
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['Date', 'Type', 'Amount', 'Category', 'Account', 'To account', 'Note']];
  Calc.txs().sort((a, b) => a.date.localeCompare(b.date)).forEach(t =>
    rows.push([t.date, t.type, t.amount, cats[t.cat] || '', accs[t.account] || '', accs[t.to] || '', t.note || '']));
  download('moneynest-transactions.csv', '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
}

'use strict';
/* =====================================================================
   Tiny SVG chart helpers (no external libraries, work fully offline)
   ===================================================================== */
const COLORS = {
  brand: 'var(--brand)', income: 'var(--pos)', expense: 'var(--neg)', save: 'var(--save)',
  warn: 'var(--warn)', grid: 'var(--grid)', text: 'var(--muted)', ink: 'var(--ink)', zero: 'var(--zero)', card: 'var(--card)'
};

const Charts = {
  fixed: 0, // the PDF report sets a fixed width
  width() {
    if (this.fixed) return this.fixed;
    const main = document.querySelector('.main');
    const w = (main ? main.clientWidth : window.innerWidth) - 64;
    return Math.max(300, Math.min(760, w));
  },
  niceMax(v) {
    if (v <= 0) return 100;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return m * p;
  },
  empty(msg) { return '<div class="chart-empty">' + esc(msg) + '</div>'; },

  /* axis + grid shared by bar/line charts */
  frame(W, H, pl, pr, pt, pb, max, ticks) {
    let s = '';
    for (let i = 0; i <= ticks; i++) {
      const v = (max / ticks) * i;
      const y = H - pb - (H - pt - pb) * (v / max);
      s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="' + COLORS.grid + '" stroke-width="1"/>';
      s += '<text x="' + (pl - 6) + '" y="' + (y + 3.5) + '" text-anchor="end" font-size="10.5" fill="' + COLORS.text + '">' + shortNum(v) + '</text>';
    }
    return s;
  },

  /* daily spending bars with a dashed daily-limit line */
  dailyBars(days, limit, ariaLabel) {
    const W = this.width(), H = 220, pl = 40, pr = 8, pt = 14, pb = 26;
    const peak = Math.max(0, ...days.map(d => d.spent));
    const max = this.niceMax(Math.max(peak, limit * 1.15));
    const n = days.length, slot = (W - pl - pr) / n, bw = Math.max(3, Math.min(26, slot * 0.64));
    const y = v => H - pb - (H - pt - pb) * (v / max);
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(ariaLabel) + '">';
    s += this.frame(W, H, pl, pr, pt, pb, max, 4);
    const every = n > 20 ? 5 : n > 12 ? 2 : 1;
    days.forEach((d, i) => {
      const x = pl + slot * i + (slot - bw) / 2;
      const h = Math.max(d.spent > 0 ? 2 : 0, H - pb - y(d.spent));
      const over = limit > 0 && d.spent > limit;
      s += '<rect class="bx" style="animation-delay:' + Math.min(0.6, i * 0.018).toFixed(2) + 's" x="' + x.toFixed(1) + '" y="' + (H - pb - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3" fill="' + (over ? COLORS.expense : COLORS.brand) + '"' + (d.future ? ' opacity=".25"' : '') + '><title>' + esc(fmtDate(d.date) + ': ' + money(d.spent)) + '</title></rect>';
      if ((i + 1) % every === 0 || i === 0) s += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10.5" fill="' + COLORS.text + '">' + localDigits(d.day) + '</text>';
    });
    if (limit > 0) {
      s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(limit) + '" y2="' + y(limit) + '" stroke="' + COLORS.warn + '" stroke-width="1.6" stroke-dasharray="5 4" class="fadein-el"/>';
    }
    return s + '</svg>';
  },

  /* income vs expense per month */
  groupedBars(months, ariaLabel) {
    const W = this.width(), H = 220, pl = 40, pr = 8, pt = 14, pb = 26;
    const max = this.niceMax(Math.max(0, ...months.map(m => Math.max(m.income, m.expense))) * 1.1);
    const n = months.length, slot = (W - pl - pr) / n, bw = Math.max(8, Math.min(30, slot * 0.30));
    const y = v => H - pb - (H - pt - pb) * (v / max);
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(ariaLabel) + '">';
    s += this.frame(W, H, pl, pr, pt, pb, max, 4);
    months.forEach((m, i) => {
      const cx = pl + slot * i + slot / 2;
      [['income', COLORS.income, -bw - 1], ['expense', COLORS.expense, 1]].forEach(([k, col, dx]) => {
        const h = Math.max(m[k] > 0 ? 2 : 0, H - pb - y(m[k]));
        s += '<rect class="bx" style="animation-delay:' + (i * 0.08 + (k === 'expense' ? 0.05 : 0)).toFixed(2) + 's" x="' + (cx + dx).toFixed(1) + '" y="' + (H - pb - h).toFixed(1) + '" width="' + bw + '" height="' + h.toFixed(1) + '" rx="3" fill="' + col + '"><title>' + esc(fmtMonth(m.ym) + ' – ' + money(m[k])) + '</title></rect>';
      });
      s += '<text x="' + cx.toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10.5" fill="' + COLORS.text + '">' + esc(fmtMonthShort(m.ym)) + '</text>';
    });
    return s + '</svg>';
  },

  /* donut for categories */
  donut(items, centerLabel, ariaLabel) {
    const total = items.reduce((s, i) => s + i.value, 0);
    const size = 190, r = 70, sw = 28, c = 2 * Math.PI * r, cx = size / 2;
    let s = '<svg viewBox="0 0 ' + size + ' ' + size + '" width="190" height="190" role="img" aria-label="' + esc(ariaLabel) + '">';
    s += '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + COLORS.grid + '" stroke-width="' + sw + '"/>';
    let offset = 0;
    s += '<g class="donut-seg">';
    items.forEach(it => {
      const len = (it.value / total) * c;
      s += '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + it.color + '" stroke-width="' + sw + '" stroke-dasharray="' + Math.max(0, len - 1.5).toFixed(2) + ' ' + (c - Math.max(0, len - 1.5)).toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cx + ')"><title>' + esc(it.name + ': ' + money(it.value)) + '</title></circle>';
      offset += len;
    });
    s += '</g>';
    s += '<text x="' + cx + '" y="' + (cx - 4) + '" text-anchor="middle" font-size="11" fill="' + COLORS.text + '">' + esc(centerLabel) + '</text>';
    s += '<text x="' + cx + '" y="' + (cx + 15) + '" text-anchor="middle" font-size="17" font-weight="700" fill="' + COLORS.ink + '">' + esc(money(total)) + '</text>';
    return s + '</svg>';
  },

  /* line with soft area (cumulative savings) */
  line(points, ariaLabel, color) {
    const W = this.width(), H = 220, pl = 44, pr = 12, pt = 14, pb = 26;
    const vals = points.map(p => p.y);
    let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
    if (hi === lo) hi = lo + 100;
    const step = this.niceMax(hi - lo) / 4;
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
    if (hi <= lo) hi = lo + step;
    const y = v => H - pb - (H - pt - pb) * ((v - lo) / (hi - lo));
    const n = points.length;
    const x = i => pl + (n === 1 ? (W - pl - pr) / 2 : (W - pl - pr) * (i / (n - 1)));
    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(ariaLabel) + '">';
    for (let v = lo; v <= hi + 0.001; v += step) {
      s += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + (Math.abs(v) < 0.001 ? COLORS.zero : COLORS.grid) + '"/>';
      s += '<text x="' + (pl - 6) + '" y="' + (y(v) + 3.5) + '" text-anchor="end" font-size="10.5" fill="' + COLORS.text + '">' + shortNum(v) + '</text>';
    }
    const path = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.y).toFixed(1)).join(' ');
    const area = path + ' L' + x(n - 1).toFixed(1) + ' ' + y(0).toFixed(1) + ' L' + x(0).toFixed(1) + ' ' + y(0).toFixed(1) + ' Z';
    s += '<path class="area" d="' + area + '" fill="' + color + '" opacity=".12"/>';
    s += '<path class="draw bar-glow" pathLength="1" d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
    const every = n > 20 ? 5 : n > 12 ? 2 : 1;
    points.forEach((p, i) => {
      if (n <= 31) s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.y).toFixed(1) + '" r="' + (n > 20 ? 2.4 : 3.2) + '" fill="' + COLORS.card + '" stroke="' + color + '" stroke-width="2"><title>' + esc(p.tip) + '</title></circle>';
      if ((i + 1) % every === 0 || i === 0) s += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10.5" fill="' + COLORS.text + '">' + esc(p.label) + '</text>';
    });
    return s + '</svg>';
  },

  /* small progress ring for the daily target */
  ring(pct, color, big, small) {
    const size = 132, r = 54, sw = 12, c = 2 * Math.PI * r, cx = size / 2;
    const p = Math.max(0, Math.min(1, pct));
    let s = '<svg viewBox="0 0 ' + size + ' ' + size + '" width="132" height="132" aria-hidden="true">';
    s += '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + COLORS.grid + '" stroke-width="' + sw + '"/>';
    s += '<circle cx="' + cx + '" cy="' + cx + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + sw + '" stroke-linecap="round" pathLength="100" stroke-dasharray="' + (p * 100).toFixed(2) + ' 100" class="ring-arc" style="color:' + color + '" transform="rotate(-90 ' + cx + ' ' + cx + ')"/>';
    s += '<text x="' + cx + '" y="' + (cx + 2) + '" text-anchor="middle" font-size="20" font-weight="700" fill="' + COLORS.ink + '" style="font-family:var(--font-display)">' + esc(big) + '</text>';
    s += '<text x="' + cx + '" y="' + (cx + 20) + '" text-anchor="middle" font-size="10.5" fill="' + COLORS.text + '">' + esc(small) + '</text>';
    return s + '</svg>';
  }
};

'use strict';
/* =====================================================================
   Google Drive sync (optional).
   Every device (PC browser, phone) writes ONE file of its own into a "MoneyNest" folder
   in your Google Drive and reads the files of the other devices. Records are merged by
   "newest edit wins". Nothing is ever deleted from Drive, and deletions inside the app are kept
   as markers, so no device can erase another device's data. A backup file is also saved
   once per month and never changed afterwards.
   ===================================================================== */
const Drive = {
  state: 'off', // off | ok | syncing | reconnect | error | offline
  msg: '',
  busy: false,
  timer: null,
  tokenClient: null,
  scope: 'https://www.googleapis.com/auth/drive.file',
  api() { return (window.MN_CONFIG && MN_CONFIG.driveApi) || 'https://www.googleapis.com'; },
  clientId() {
    let id = (window.MN_CONFIG && MN_CONFIG.googleClientId) || '';
    if (!id) { try { id = localStorage.getItem('mn_gclient') || ''; } catch (e) { /* ignore */ } }
    return id.trim();
  },
  enabled() { return !!(this.clientId() && Store.d && Store.d.driveOn); },
  deviceId() {
    let id = '';
    try { id = localStorage.getItem('mn_device') || ''; } catch (e) { /* ignore */ }
    if (!id) { id = uid(); try { localStorage.setItem('mn_device', id); } catch (e) { /* ignore */ } }
    return id;
  },
  set(state, msg) { this.state = state; this.msg = msg || ''; if ((typeof UI !== "undefined" && UI)) { UI.syncBadge(); UI.driveCardUpdate(); } },

  /* ---------- sign-in (Google Identity Services) ---------- */
  getStoredToken() {
    try { const j = JSON.parse(localStorage.getItem('mn_gtoken') || 'null'); if (j && j.exp > Date.now() + 60000) return j.t; } catch (e) { /* ignore */ }
    return '';
  },
  hasToken() { return !!(this.testToken() || this.getStoredToken()); },
  testToken() { return (window.MN_CONFIG && MN_CONFIG.testToken) || ''; },
  loadGsi() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    if (this._gsi) return this._gsi;
    this._gsi = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      s.onload = () => res(); s.onerror = () => { this._gsi = null; rej(new Error('offline')); };
      document.head.appendChild(s);
    });
    return this._gsi;
  },
  async token(interactive) {
    const tt = this.testToken(); if (tt) return tt;
    const have = this.getStoredToken(); if (have) return have;
    await this.loadGsi();
    return new Promise((res, rej) => {
      if (!this.tokenClient) {
        this.tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: this.clientId(), scope: this.scope,
          callback: r => {
            if (r && r.access_token) {
              try { localStorage.setItem('mn_gtoken', JSON.stringify({ t: r.access_token, exp: Date.now() + (+r.expires_in || 3600) * 1000 })); } catch (e) { /* ignore */ }
              this._cb && this._cb.res(r.access_token);
            } else this._cb && this._cb.rej(new Error((r && r.error) || 'denied'));
          },
          error_callback: e => { this._cb && this._cb.rej(new Error((e && e.type) || 'popup')); }
        });
      }
      this._cb = { res, rej };
      setTimeout(() => rej(new Error('timeout')), 90000);
      try { this.tokenClient.requestAccessToken({ prompt: '' }); } catch (e) { rej(e); }
    });
  },
  forgetToken() { try { localStorage.removeItem('mn_gtoken'); } catch (e) { /* ignore */ } },

  /* ---------- Drive REST ---------- */
  async call(path, opts, tok) {
    const r = await fetch(this.api() + path, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + tok }, (opts && opts.headers) || {}) }));
    if (r.status === 401) { this.forgetToken(); const e = new Error('auth'); e.auth = true; throw e; }
    if (!r.ok) { let m = ''; try { m = (await r.json()).error.message; } catch (e) { /* ignore */ } const e = new Error(m || ('HTTP ' + r.status)); e.status = r.status; throw e; }
    return r;
  },
  async list(q, fields, tok) {
    const out = []; let page = '';
    do {
      const r = await this.call('/drive/v3/files?pageSize=200&spaces=drive&q=' + encodeURIComponent(q) + '&fields=' + encodeURIComponent('nextPageToken,files(' + fields + ')') + (page ? '&pageToken=' + page : ''), {}, tok);
      const j = await r.json(); out.push(...(j.files || [])); page = j.nextPageToken || '';
    } while (page);
    return out;
  },
  async upload(meta, bodyObj, tok, id) {
    const b = 'mn' + Math.random().toString(36).slice(2);
    const body = '--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(meta) + '\r\n--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(bodyObj) + '\r\n--' + b + '--';
    const r = await this.call('/upload/drive/v3/files' + (id ? '/' + id : '') + '?uploadType=multipart&fields=id,modifiedTime', { method: id ? 'PATCH' : 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + b }, body }, tok);
    return r.json();
  },
  async download(id, tok) { const r = await this.call('/drive/v3/files/' + id + '?alt=media', {}, tok); return r.json(); },

  /* ---------- merge ---------- */
  mergeIn(records) {
    let touched = 0;
    for (const key in records || {}) {
      const r = records[key];
      if (!r || typeof r.kind !== 'string' || typeof r.id !== 'string' || !isFinite(+r.updated_at) || typeof r.data !== 'object' || r.data === null) continue;
      if (key !== r.kind + ':' + r.id) continue;
      const loc = Store.d.records[key];
      if (!loc || r.updated_at > loc.updated_at) {
        Store.d.records[key] = { kind: r.kind, id: r.id, data: r.data, updated_at: +r.updated_at, deleted: r.deleted ? 1 : 0 };
        if (!STANDALONE) Store.d.dirty[key] = +r.updated_at; // PC database should receive it too
        touched++;
      }
    }
    return touched;
  },
  signature() {
    let n = 0, mx = 0, sum = 0;
    for (const k in Store.d.records) { const u = Store.d.records[k].updated_at; n++; if (u > mx) mx = u; sum = (sum + (u % 1000003)) % 1000000007; }
    return n + ':' + mx + ':' + sum;
  },

  /* ---------- the sync ---------- */
  async sync(interactive) {
    if (!this.clientId()) { this.set('off'); return; }
    if (this.busy) return;
    this.busy = true;
    const prev = this.state;
    try {
      let tok;
      try { tok = await this.token(!!interactive); }
      catch (e) { this.set(e.message === 'offline' || !navigator.onLine ? 'offline' : 'reconnect'); return; }
      this.set('syncing');
      // 1. folder(s)
      let folders = await this.list("name = 'MoneyNest' and mimeType = 'application/vnd.google-apps.folder' and trashed = false", 'id,name,createdTime', tok);
      folders.sort((a, b) => String(a.createdTime).localeCompare(String(b.createdTime)));
      if (!folders.length) {
        const r = await this.call('/drive/v3/files?fields=id,createdTime', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'MoneyNest', mimeType: 'application/vnd.google-apps.folder' }) }, tok);
        folders = [await r.json()];
      }
      const home = folders[0].id;
      // 2. files of all devices (own file included, so a wiped device gets everything back)
      let files = [];
      for (const f of folders) files.push(...await this.list("'" + f.id + "' in parents and trashed = false", 'id,name,modifiedTime', tok));
      const me = 'moneynest-device-' + this.deviceId() + '.json';
      const seen = Store.d.driveSeen || (Store.d.driveSeen = {});
      let pulled = 0;
      for (const f of files) {
        if (!/^moneynest-device-.+\.json$/.test(f.name)) continue;
        if (seen[f.id] === f.modifiedTime) continue;
        const j = await this.download(f.id, tok);
        if (j && j.records) pulled += this.mergeIn(j.records);
        seen[f.id] = f.modifiedTime;
      }
      if (pulled) Store.save();
      // 3. upload own file if anything changed
      const mine = files.find(f => f.name === me);
      const sig = this.signature();
      if (!mine || Store.d.driveSig !== sig) {
        const payload = { app: 'MoneyNest', version: 1, device: this.deviceId(), label: STANDALONE ? 'phone/web' : 'pc', savedAt: Date.now(), records: Store.d.records };
        const up = await this.upload(mine ? { name: me } : { name: me, parents: [home], mimeType: 'application/json' }, payload, tok, mine && mine.id);
        seen[up.id] = up.modifiedTime;
        Store.d.driveSig = sig;
      }
      // 4. one permanent backup per month (created once, never changed or deleted)
      const bk = 'moneynest-backup-' + curMonth() + '.json';
      if (!files.some(f => f.name === bk)) {
        await this.upload({ name: bk, parents: [home], mimeType: 'application/json' }, { app: 'MoneyNest', version: 1, savedAt: Date.now(), records: Store.d.records }, tok);
